name: LearnSmart CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas==3.0.6 scikit-learn==1.9.1 fastapi==0.141.1 pydantic==2.13.5 httpx==0.28.1 pytest==8.4.2

      - name: Run tests
        run: |
          pytest -q